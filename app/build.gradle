plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartappmaster'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smartappmaster'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.1.0-experimental'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
